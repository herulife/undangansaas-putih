services:
  postgres:
    image: postgres:16-alpine
    container_name: undangan-modern-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-undangan_saas}
      POSTGRES_USER: ${POSTGRES_USER:-undangan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-undangan}
    ports:
      - "5440:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./apps/api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U undangan -d undangan_saas"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: undangan-modern-redis
    ports:
      - "6380:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  api:
    build:
      context: ./apps/api
    container_name: undangan-modern-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      APP_ENV: development
      API_PORT: 8090
      WEB_ORIGIN: http://localhost:5174
      DATABASE_URL: postgres://undangan:undangan@postgres:5432/undangan_saas?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: change-this-secret-before-production
    ports:
      - "8090:8090"

  web:
    build:
      context: ./apps/web
      args:
        VITE_API_URL: http://localhost:8090/api
    container_name: undangan-modern-web
    depends_on:
      - api
    ports:
      - "5174:80"

volumes:
  postgres-data:
  redis-data:
