server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Security Headers
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://www.youtube.com https://s.ytimg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https://api.resend.com; frame-src 'self' https://www.google.com https://maps.google.com https://www.youtube.com https://www.youtube-nocookie.com;" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;


  location = /templates/wedding-premium050-pixel-clean {
    return 301 /templates/wedding-premium050-pixel-clean/;
  }

  location ^~ /templates/wedding-premium050-pixel-clean/assets/ {
    alias /usr/share/nginx/html/template-assets/wedding-premium050-pixel-clean/assets/;
    expires 30d;
    add_header Cache-Control public,max-age=2592000,immutable;
    try_files $uri =404;
  }

  location ^~ /templates/wedding-premium050-pixel-clean/ {
    alias /usr/share/nginx/html/template-assets/wedding-premium050-pixel-clean/;
    index index.html;
    add_header Cache-Control public,max-age=300;
    try_files $uri $uri/ =404;
  }

  location ^~ /template-assets/wedding-premium050-original/ {
    rewrite ^/template-assets/wedding-premium050-original/(.*)$ https://$host/template-assets/wedding-premium050-pixel-clean/$1 permanent;
  }

  location ^~ /template-assets/wedding-premium050-pixel-clean/assets/ {
    expires 30d;
    add_header Cache-Control public,max-age=2592000,immutable;
    try_files $uri =404;
  }

  location ^~ /template-assets/ {
    add_header Cache-Control public,max-age=300;
    try_files $uri $uri/ =404;
  }

  # Server-rendered invitation page with per-invitation Open Graph meta so
  # link previews (WhatsApp, etc.) show the couple, date, and cover image.
  location ^~ /u/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://linkundang-api:8088;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control public,max-age=31536000,immutable;
    try_files $uri =404;
  }

  location = /sitemap.xml {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://linkundang-api:8088/sitemap.xml;
    proxy_cache_valid 200 1h;
  }

  location /api/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://linkundang-api:8088;
  }

  location /uploads/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://linkundang-api:8088;
  }
}
